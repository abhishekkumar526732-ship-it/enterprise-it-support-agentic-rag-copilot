name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: it-support-copilot
  AUTO_SCALING_GROUP_NAME: it-copilot-asg

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Test Suite
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: test-secret-key-test-secret-key-32b
        run: |
          pytest tests/ -v

  build-and-deploy:
    name: Build Docker & Rolling Deploy to AWS ASG
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger Rolling Update on AWS EC2 Auto Scaling Group
        run: |
          echo "Starting instance refresh for Auto Scaling Group: $AUTO_SCALING_GROUP_NAME..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$AUTO_SCALING_GROUP_NAME" \
            --preferences '{"MinHealthyPercentage": 66, "InstanceWarmup": 60}' \
            --region "$AWS_REGION"
          echo "Instance refresh successfully triggered."
